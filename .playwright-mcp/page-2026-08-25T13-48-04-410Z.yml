          - generic [ref=f33e89]:
            - heading "The Fixed by Design wiki" [level=1] [ref=f33e90]
            - paragraph [ref=f33e91]: Fixed by Design is an opinionated Fabric modpack that redesigns Minecraft Survival. It is not a kitchen-sink pack and it does not add a tech tree. The world you load looks like Minecraft and plays like Minecraft, and then behaves differently in specific, deliberate places.
            - paragraph [ref=f33e92]: This wiki documents those places.
            - heading [level=2] [ref=f33e93]:
              - link [ref=f33e94] [cursor=pointer]:
                - /url: "#what-the-project-is-trying-to-do"
            - paragraph [ref=f33e97]: "Minecraft Survival has excellent foundations. Over fifteen years, several of its systems accumulated problems that have nothing to do with the ideas underneath them: dominant strategies that crowd out every alternative, progressions that one item trivialises, rules written for one player and then applied to twenty, whole mechanics nobody has a reason to touch, and features that quietly delete other features."
            - paragraph [ref=f33e98]: Every change here starts from the same four questions.
            - list [ref=f33e99]:
              - listitem [ref=f33e100]: What was this system trying to achieve?
              - listitem [ref=f33e101]: What behaviour does it actually reward?
              - listitem [ref=f33e102]: Where does it become tedious, dominant, irrelevant or broken?
              - listitem [ref=f33e103]: Can it be improved without making Minecraft feel like a different game?
            - paragraph [ref=f33e104]: The answer is never "add more". It is usually "give this system back its decision".
            - generic [ref=f33e105]: Fixed by Design is opinionated by construction. Where a change is contentious, the reasoning is published rather than hidden, and most server-side rules have a gamerule that turns them off.
            - heading [level=2] [ref=f33e107]:
              - link [ref=f33e108] [cursor=pointer]:
                - /url: "#what-lives-where"
            - paragraph [ref=f33e111]:
              - text: This wiki answers
              - strong [ref=f33e112]: how do I use this mechanic
              - text: . It is the reference you open while playing.
            - paragraph [ref=f33e113]:
              - link "Features" [ref=f33e114] [cursor=pointer]:
                - /url: /features
              - text: answers
              - strong [ref=f33e115]: what changed and why
              - text: . Each feature page states the vanilla behaviour, the design problem, and the fix.
            - paragraph [ref=f33e116]:
              - link "Design decisions" [ref=f33e117] [cursor=pointer]:
                - /url: /design
              - text: answers
              - strong [ref=f33e118]: why we chose this over the alternatives
              - text: . Problem, evidence, constraints, considered solutions, decision, consequences.
            - paragraph [ref=f33e119]:
              - link "Roadmap" [ref=f33e120] [cursor=pointer]:
                - /url: /roadmap
              - text: is what is coming next.
              - link "Changelog" [ref=f33e121] [cursor=pointer]:
                - /url: /changelog
              - text: is what already shipped.
            - heading [level=2] [ref=f33e122]:
              - link [ref=f33e123] [cursor=pointer]:
                - /url: "#the-four-mods"
            - paragraph [ref=f33e126]: The pack is built on four first-party mods. You do not need to know their names to play, and nothing in this wiki is organised by them, but they are what the Features section maps back to.
