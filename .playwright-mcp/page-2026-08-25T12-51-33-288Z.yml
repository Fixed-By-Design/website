      - generic [ref=f6e37]:
        - heading "Enchanting" [level=1] [ref=f6e38]
        - paragraph [ref=f6e39]:
          - text: The enchanting table opens the
          - strong [ref=f6e40]: Catalogue
          - text: . There are no random offers, no lapis, and no rerolling.
        - heading [level=2] [ref=f6e41]:
          - link "Building the room" [ref=f6e42] [cursor=pointer]:
            - /url: "#building-the-room"
        - paragraph [ref=f6e43]: "The table reads the same fifteen positions vanilla always used: two rings of blocks around it, with a clear path so nothing blocks the connection."
        - paragraph [ref=f6e44]: What sits in those positions matters now.
        - paragraph [ref=f6e45]:
          - strong [ref=f6e46]: Chiseled bookshelves
          - text: are your spellbook. Any enchanted book stored in one becomes selectable in the Catalogue. A chiseled bookshelf holds six books, so a single shelf can teach six enchantments.
        - paragraph [ref=f6e47]:
          - strong [ref=f6e48]: Regular bookshelves
          - text: are a discount. Each one cuts reagent cost by 3.33%, capped at fifteen shelves for 50% off.
        - paragraph [ref=f6e49]: "A good room is a mix: chiseled shelves for the enchantments you actually want, regular shelves in the remaining slots for the discount."
        - generic [ref=f6e50]: Chiseled bookshelf contents are synced to every player, so the Catalogue works correctly in multiplayer and the hover labels show what is inside without opening the shelf.
        - heading [level=2] [ref=f6e52]:
          - link "Using the Catalogue" [ref=f6e53] [cursor=pointer]:
            - /url: "#using-the-catalogue"
        - paragraph [ref=f6e54]: The screen has three slots and a list.
        - list [ref=f6e55]:
          - listitem [ref=f6e56]:
            - strong [ref=f6e57]: Item slot.
            - text: Put in the thing you want to enchant.
          - listitem [ref=f6e58]:
            - strong [ref=f6e59]: Reagent slot.
            - text: Put in the material the enchantment demands.
          - listitem [ref=f6e60]:
            - strong [ref=f6e61]: The list.
            - text: Each row is one enchantment, with a clickable Roman numeral per level.
        - paragraph [ref=f6e62]:
          - text: "Row colours tell you where you stand:"
          - strong [ref=f6e63]: green
          - text: means the item already has that level,
          - strong [ref=f6e64]: bright
          - text: means you can afford it,
          - strong [ref=f6e65]: dimmed
          - text: means you cannot.
        - paragraph [ref=f6e66]: "Hovering a level shows the full cost: reagent count, experience levels, and how many slots it will take."
        - heading [level=2] [ref=f6e67]:
          - link "Reagents" [ref=f6e68] [cursor=pointer]:
            - /url: "#reagents"
        - paragraph [ref=f6e69]: Every enchantment has its own reagent. Lapis Lazuli is the fallback for Mending and anything not listed.
