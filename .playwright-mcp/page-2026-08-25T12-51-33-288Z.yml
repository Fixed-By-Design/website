        - paragraph [ref=f6e173]:
          - strong [ref=f6e174]: Quantity
          - text: "is the level times two: two reagents at level I, ten at level V. The bookshelf discount reduces that, never below one. Upgrading an existing enchantment charges only the difference."
        - paragraph [ref=f6e175]:
          - strong [ref=f6e176]: Experience
          - text: is 2, 4, 7 or 10 levels for I through IV, and 10 for anything above. Mending is a flat 8. Upgrades pay the delta.
        - heading [level=2] [ref=f6e177]:
          - link "Slots" [ref=f6e178] [cursor=pointer]:
            - /url: "#slots"
        - paragraph [ref=f6e179]: Every item has a budget. Enchantments cost slots equal to their level.
        - table [ref=f6e181]:
          - rowgroup [ref=f6e182]:
            - row [ref=f6e183]:
              - columnheader "Slots" [ref=f6e184]
              - columnheader "Items" [ref=f6e185]
          - rowgroup [ref=f6e186]:
            - row [ref=f6e187]:
              - cell "3" [ref=f6e188]
              - cell "Wood, stone, copper, leather, bow, fishing rod, shield" [ref=f6e189]
            - row [ref=f6e190]:
              - cell "4" [ref=f6e191]
              - cell "Iron, chainmail, crossbow" [ref=f6e192]
            - row [ref=f6e193]:
              - cell "5" [ref=f6e194]
              - cell "Diamond, netherite, elytra, turtle helmet, mace, trident" [ref=f6e195]
            - row [ref=f6e196]:
              - cell "6" [ref=f6e197]
              - cell "All gold gear" [ref=f6e198]
        - paragraph [ref=f6e199]: Mending always costs 3. Curses cost 0 and each one grants a bonus slot.
        - paragraph [ref=f6e200]: "The pip bar at the bottom of the Catalogue shows the budget: filled pips are used, blinking pips are what you are about to spend, red pips are slots the grindstone took away."
        - generic [ref=f6e201]: The grindstone strips everything including curses, and permanently removes one maximum slot each time you use it. An anvil can buy one slot back with the item's repair material, but it is never free.
        - heading [level=2] [ref=f6e203]:
          - link "Getting books in the first place" [ref=f6e204] [cursor=pointer]:
            - /url: "#getting-books-in-the-first-place"
        - paragraph [ref=f6e205]: Enchanted books are found, not made.
        - list [ref=f6e206]:
          - listitem [ref=f6e207]:
            - strong [ref=f6e208]: Structure chests
            - text: across the world each carry a themed pool. Ancient cities hold Veil, Wraith, Swift Sneak and Curse of Binding. Nether fortresses hold Fire Aspect, Flame, Venom and Looting. End city treasure is where Mending lives.
          - listitem [ref=f6e209]:
            - strong [ref=f6e210]: Villager trades.
            - text: Librarians sell Feather Falling and Knockback at tier 1. Clerics sell Frost Walker and Luck of the Sea. Weaponsmiths sell Step-Up.
          - listitem [ref=f6e211]:
            - strong [ref=f6e212]: The stronghold library
            - text: has been rebuilt around four chiseled bookshelves holding one book each.
        - heading [level=2] [ref=f6e213]:
