  - main [ref=f30e41]:
    - generic [ref=f30e42]:
      - generic [ref=f30e46]:
        - heading "Changelog" [level=1] [ref=f30e48]
        - generic [ref=f30e49]: Player-readable release notes. Raw commits live on GitHub.
      - generic [ref=f30e50]:
        - article [ref=f30e52]:
          - generic [ref=f30e53]:
            - heading "Fixed SMP 1.8.0" [level=2] [ref=f30e54]
            - generic [ref=f30e55]: Stable
            - generic [ref=f30e57]: Minecraft 26.1.2
            - time [ref=f30e59]: August 22, 2026
          - paragraph [ref=f30e60]: The enchanting rework ships alongside copper rails, trains, campfire elytra flight and the Map Book. This is the release the four first-party mods were building toward.
          - generic [ref=f30e61]:
            - link "Download 1.8.0" [ref=f30e62] [cursor=pointer]:
              - /url: https://modrinth.com/modpack/fixed-smp-modpack
            - link "Source" [ref=f30e64] [cursor=pointer]:
              - /url: https://github.com/Fixed-By-Design
          - generic [ref=f30e66]:
            - generic [ref=f30e67]:
              - heading "Highlights" [level=3] [ref=f30e68]
              - list [ref=f30e69]:
                - listitem [ref=f30e70]: The Catalogue replaces random enchanting entirely
                - listitem [ref=f30e71]: Four smithing upgrades replace twelve vanilla enchantments
                - listitem [ref=f30e72]: Copper rails with real speed tiers, and furnace locomotives that pull trains
                - listitem [ref=f30e73]: Elytra flight runs on campfires instead of firework rockets
                - listitem [ref=f30e74]: The Map Book, a shareable multi-map atlas
                - listitem [ref=f30e75]: Partial keep inventory, with bonus hearts as the death penalty
            - generic [ref=f30e76]:
              - heading "Fixes" [level=3] [ref=f30e77]
              - list [ref=f30e78]:
                - listitem [ref=f30e79]: Lodestone compasses no longer forget their target across unloaded chunks
                - listitem [ref=f30e80]: Eyes of ender survive nine throws in ten instead of breaking constantly
                - listitem [ref=f30e81]: Maps in item frames render every decoration, including player markers
            - generic [ref=f30e82]:
              - heading "Breaking changes" [level=3] [ref=f30e83]
              - list [ref=f30e84]:
                - listitem [ref=f30e85]: Twelve vanilla enchantments are removed. Existing items keep them but they can no longer be applied, and the anvil no longer accepts enchanted books.
                - listitem [ref=f30e86]: Firework rockets give zero thrust while gliding. Set the firework_boosts_flight gamerule to true to restore vanilla behaviour.
                - listitem [ref=f30e87]: Ore density near world spawn is reduced to 45%. Existing chunks are unaffected; newly generated chunks follow the new curve.
          - generic [ref=f30e89]:
            - heading [level=2] [ref=f30e90]:
              - link [ref=f30e91] [cursor=pointer]:
                - /url: "#what-this-release-is"
            - paragraph [ref=f30e94]: 1.8.0 is the point where the four first-party mods stop being separate experiments and start being one design.
            - paragraph [ref=f30e95]: Enchantment Overhaul finished the split between statistics and magic. Minecarts Overhaul made rail worth building. Exploration Reloaded replaced rocket flight with something you have to plan. Fairlands gave death a cost that is real without being ruinous.
            - paragraph [ref=f30e96]: They were designed to interlock, and this is the first version where all four are stable at the same time.
            - heading [level=2] [ref=f30e97]:
              - link [ref=f30e98] [cursor=pointer]:
                - /url: "#enchanting"
            - paragraph [ref=f30e101]:
              - text: The enchanting table opens the
              - strong [ref=f30e102]: Catalogue
              - text: ": a list of every enchantment stored in chiseled bookshelves around it. You pick the enchantment and the level, pay a reagent specific to that enchantment and an experience cost, and get exactly what you asked for."
            - paragraph [ref=f30e103]:
              - text: Twelve vanilla enchantments are gone.
              - strong [ref=f30e104]: Honing
              - text: ","
              - strong [ref=f30e105]: Warding
              - text: ","
              - strong [ref=f30e106]: Tempering
              - text: and
              - strong [ref=f30e107]: Grinding
              - text: are smithing templates now, and the ingot you use decides the level.
            - paragraph [ref=f30e108]:
              - text: Every item has a
              - strong [ref=f30e109]: slot budget
              - text: ", from 3 to 6 depending on material. Enchantments cost slots equal to their level. Curses cost nothing and grant one."
            - paragraph [ref=f30e110]: The grindstone permanently scars an item, removing one maximum slot per use. An anvil can buy one back.
            - paragraph [ref=f30e111]:
              - text: Armor materials carry
              - strong [ref=f30e112]: innate resistances
              - text: ": netherite resists fire, diamond resists explosions, gold resists magic, iron and chainmail resist projectiles, copper resists poison, leather resists falling."
            - heading [level=2] [ref=f30e113]:
              - link [ref=f30e114] [cursor=pointer]:
                - /url: "#transportation"
            - paragraph [ref=f30e117]:
              - strong [ref=f30e118]: Copper rails
              - text: "in four oxidation tiers set the speed ceiling: 40, 20, 10 and 5 blocks per second against vanilla's 8. They weather about four times faster than copper blocks, and honeycomb waxes them permanently."
            - paragraph [ref=f30e119]:
              - strong [ref=f30e120]: Furnace minecarts are locomotives.
              - text: Full speed, no slope penalty, any fuel, a 32000-tick tank, automatic refuelling from a chest cart behind them, and hard braking when they run dry.
            - paragraph [ref=f30e121]:
              - strong [ref=f30e122]: Trains.
              - text: A lit locomotive couples up to seven trailers, dragged at 1.5-block spacing, following curves and slopes exactly. Trains survive world reloads and stay in formation through a derailment.
            - paragraph [ref=f30e123]:
              - text: The
              - strong [ref=f30e124]: Dispenser Minecart
              - text: fires on activator rails using the full vanilla dispenser behaviour registry.
            - heading [level=2] [ref=f30e125]:
              - link [ref=f30e126] [cursor=pointer]:
                - /url: "#exploration"
            - paragraph [ref=f30e129]:
              - strong [ref=f30e130]: Firework rockets no longer boost gliding.
              - text: Campfires do. Crouch in the smoke to launch, and how hard you are thrown depends on the hearth you built around the fire. Updraft columns above lit campfires give lift mid-glide, so a line of hearths is a flight corridor.
            - paragraph [ref=f30e131]:
              - strong [ref=f30e132]: Smokestack
              - text: and
              - strong [ref=f30e133]: Cloudskipper
              - text: are new elytra enchantments, mutually exclusive. Smokestack banks charges you spend as mid-air dashes. Cloudskipper returns glide drag at altitude.
            - paragraph [ref=f30e134]:
              - text: The
              - strong [ref=f30e135]: Map Book
              - text: holds many maps in one item, opens as a pannable full-screen atlas drawn in world coordinates, and can be shared so several players read and edit the same map.
            - paragraph [ref=f30e136]: Fishing is rebuilt around bait. Wandering traders spawn at village meeting points with rebuilt stock. Structures are spread further apart.
            - heading [level=2] [ref=f30e137]:
              - link [ref=f30e138] [cursor=pointer]:
                - /url: "#survival-and-multiplayer"
            - paragraph [ref=f30e141]:
              - strong [ref=f30e142]: Partial keep inventory.
              - text: Your worn armor, tools and weapons come back in their original slots, along with half your experience.
            - paragraph [ref=f30e143]:
              - strong [ref=f30e144]: Bonus hearts
              - text: are the death penalty. A Tidal Draught permanently adds a heart, up to five. Every death resets you to zero. Hearts of the Sea are renewable through fishing.
            - paragraph [ref=f30e145]:
              - strong [ref=f30e146]: Spawn is protected
              - text: ": no PvP and no explosion griefing within 700 blocks, and respawn points must be set within 2000 blocks of world spawn."
            - paragraph [ref=f30e147]:
              - strong [ref=f30e148]: Ore progression.
              - text: Only 45% of ore veins generate within 2000 blocks of world spawn, ramping back to 100% by 6000 blocks, with bonus veins beyond that.
            - paragraph [ref=f30e149]: PvP has a 15-second combat tag, and combat logging halves your maximum health for ten minutes.
