          - generic [ref=f32e60]:
            - generic [ref=f32e61]: Stable
            - generic [ref=f32e63]: Enchantment Overhaul
            - generic [ref=f32e65]: Since 0.9.0
          - heading "The Catalogue" [level=1] [ref=f32e67]
          - paragraph [ref=f32e68]: The enchanting table becomes a catalogue of enchantments you have unlocked, paid for with reagents and experience instead of luck.
        - generic [ref=f32e70]:
          - generic [ref=f32e72]:
            - article [ref=f32e73]:
              - 'heading "The Catalogue: the reasoning" [level=2] [ref=f32e75]'
              - generic [ref=f32e76]:
                - generic [ref=f32e77]:
                  - term [ref=f32e78]: Vanilla
                  - definition [ref=f32e79]: Right-clicking an enchanting table offers three random enchantments hidden behind Standard Galactic Alphabet. You spend lapis and levels on a slot machine, reroll until the result is acceptable, and bookshelves only raise the numbers.
                - generic [ref=f32e80]:
                  - term [ref=f32e81]: Problem
                  - definition [ref=f32e82]: Randomness makes enchanting a chore rather than a decision. The optimal play is to reroll, so the system rewards patience instead of planning, and bookshelves become wallpaper you place once and never think about again.
                - generic [ref=f32e83]:
                  - term [ref=f32e84]: Fixed by Design
                  - definition [ref=f32e85]: The table opens the Catalogue, a list of every enchantment stored in the chiseled bookshelves around it. You choose the enchantment and the level, pay its specific reagent and an experience cost, and get exactly that. Bookshelves become a library you build deliberately.
            - generic [ref=f32e87]:
              - heading [level=2] [ref=f32e88]:
                - link [ref=f32e89] [cursor=pointer]:
                  - /url: "#what-changed"
              - paragraph [ref=f32e92]: "The enchanting table no longer generates offers. It opens the Catalogue: an item slot, a reagent slot, an output slot, and a scrollable list of every enchantment the room can teach you."
              - paragraph [ref=f32e93]: "An enchantment appears in that list only if a book containing it sits in a chiseled bookshelf around the table. The game still uses vanilla's fifteen bookshelf positions and still requires a clear line to each one, so the geometry you already know carries over. What changed is what those positions mean: they are no longer a power number, they are your spellbook."
              - heading [level=2] [ref=f32e94]:
                - link [ref=f32e95] [cursor=pointer]:
                  - /url: "#how-it-works"
              - paragraph [ref=f32e98]:
                - strong [ref=f32e99]: Stock the shelves.
                - text: Put enchanted books into chiseled bookshelves placed in the vanilla enchanting positions. Every enchantment stored in them becomes selectable.
              - paragraph [ref=f32e100]:
                - strong [ref=f32e101]: Pick an enchantment and a level.
                - text: Each row in the list shows one clickable Roman numeral per level. Green means you already have it, bright means you can afford it, dimmed means you cannot.
              - paragraph [ref=f32e102]:
                - strong [ref=f32e103]: Pay the reagent.
                - text: Every enchantment demands its own material rather than lapis. Fire Aspect wants Blaze Powder, Channeling wants a Lightning Rod, Silk Touch wants Cobweb, Looting wants a Rabbit's Foot. Anything without a listed reagent falls back to Lapis Lazuli.
              - paragraph [ref=f32e104]:
                - strong [ref=f32e105]: Pay the levels.
                - text: Experience is charged per enchantment, and an upgrade only ever charges the difference between what the item has and what you asked for.
              - generic [ref=f32e106]: Regular bookshelves still matter. Each one cuts reagent cost by 3.33%, up to fifteen shelves for a 50% discount. The Catalogue shows the running total as you build.
              - heading [level=2] [ref=f32e108]:
                - link [ref=f32e109] [cursor=pointer]:
                  - /url: "#reagents"
              - paragraph [ref=f32e112]: "A selection of the reagent table:"
