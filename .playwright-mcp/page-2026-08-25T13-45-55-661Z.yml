              - heading [level=2] [ref=f32e150]:
                - link [ref=f32e151] [cursor=pointer]:
                  - /url: "#why-the-names-are-still-scrambled"
              - paragraph [ref=f32e154]: "Row labels still render in the Standard Galactic Alphabet, and the real name still appears in the hover tooltip. Keeping the flourish costs nothing now that the choice is deliberate: you are reading a catalogue, not gambling on a mystery."
              - heading [level=2] [ref=f32e155]:
                - link [ref=f32e156] [cursor=pointer]:
                  - /url: "#related-systems"
              - paragraph [ref=f32e159]:
                - text: Enchantments cost slots, and every item has a slot budget. See
