        - generic [ref=e59]:
          - generic [ref=e60]:
            - paragraph [ref=e61]: The idea
            - heading "Minecraft Survival has incredible foundations." [level=2] [ref=e62]
            - paragraph [ref=e63]: Fixed by Design rethinks the systems that get in their way. It is not a different game, a kitchen-sink modpack, or a collection of buffs. It is a redesign that keeps every system's original purpose and fixes what that system actually encourages you to do.
            - paragraph [ref=e64]: "Every change starts from the same four questions: what was this system trying to achieve, what behaviour does it actually reward, where does it become tedious or dominant, and can it be improved without making Minecraft feel like something else."
          - list [ref=e65]:
            - listitem [ref=e66]:
              - paragraph [ref=e67]: Dominant strategies
              - paragraph [ref=e68]: One correct answer crowds out every alternative.
            - listitem [ref=e69]:
              - paragraph [ref=e70]: Trivialised progression
              - paragraph [ref=e71]: A single item ends a whole progression curve.
            - listitem [ref=e72]:
              - paragraph [ref=e73]: Multiplayer friction
              - paragraph [ref=e74]: Rules built for one player, applied to twenty.
            - listitem [ref=e75]:
              - paragraph [ref=e76]: Forgotten mechanics
              - paragraph [ref=e77]: Whole systems nobody has a reason to touch.
            - listitem [ref=e78]:
              - paragraph [ref=e79]: Tedium without decisions
              - paragraph [ref=e80]: Time spent that never asks you to choose.
            - listitem [ref=e81]:
              - paragraph [ref=e82]: Systems undermining systems
              - paragraph [ref=e83]: One feature quietly deleting another.
        - generic [ref=e85]:
          - generic [ref=e86]:
            - paragraph [ref=e87]: Designed systems
            - heading "Four pillars, rebuilt system by system." [level=2] [ref=e88]
          - generic [ref=e89]:
            - link [ref=e90] [cursor=pointer]:
              - /url: /features?category=enchanting
              - heading "Equipment & Enchanting" [level=3] [ref=e92]
              - paragraph [ref=e94]: Enchanting stops being a slot machine. It becomes a catalogue you stock yourself, spent against a budget.
              - paragraph [ref=e95]: The Catalogue · Enchantment slots · Smithing upgrades · Material resistances
            - link [ref=e96] [cursor=pointer]:
              - /url: /features?category=maps-navigation
              - heading "Exploration & Navigation" [level=3] [ref=e98]
              - paragraph [ref=e100]: Flight runs on campfires you built, and the map becomes an atlas a whole server can edit.
              - paragraph [ref=e101]: Campfire flight · Map Book · Shared cartography · Reworked fishing
            - link [ref=e102] [cursor=pointer]:
              - /url: /features?category=death
              - heading "Survival & Multiplayer" [level=3] [ref=e104]
              - paragraph [ref=e106]: Death costs something real without costing everything, and the world has a shape worth crossing.
              - paragraph [ref=e107]: Bonus hearts · Partial keep inventory · Spawn protection · Ore progression
            - link [ref=e108] [cursor=pointer]:
              - /url: /features?category=minecarts-trains
              - heading "Transportation" [level=3] [ref=e110]
              - paragraph [ref=e112]: Rails become infrastructure. Copper sets the speed, and a locomotive pulls a real train behind it.
              - paragraph [ref=e113]: Copper rails · Furnace locomotives · Minecart trains · Dispenser Minecart
        - generic [ref=e115]:
          - generic [ref=e116]:
            - paragraph [ref=e117]: How a change is made
            - heading "Vanilla, the problem, and the fix." [level=2] [ref=e118]
            - paragraph [ref=e119]: Every feature is documented the same way. Here is what that looks like in practice.
          - generic [ref=e120]:
            - article [ref=e121]:
              - generic [ref=e122]:
                - heading "The Catalogue" [level=3] [ref=e123]
                - link "Read more" [ref=e124] [cursor=pointer]:
                  - /url: /features/the-catalogue
              - generic [ref=e126]:
                - generic [ref=e127]:
                  - term [ref=e128]: Vanilla
                  - definition [ref=e129]: Right-clicking an enchanting table offers three random enchantments hidden behind Standard Galactic Alphabet. You spend lapis and levels on a slot machine, reroll until the result is acceptable, and bookshelves only raise the numbers.
                - generic [ref=e130]:
                  - term [ref=e131]: Problem
                  - definition [ref=e132]: Randomness makes enchanting a chore rather than a decision. The optimal play is to reroll, so the system rewards patience instead of planning, and bookshelves become wallpaper you place once and never think about again.
                - generic [ref=e133]:
                  - term [ref=e134]: Fixed by Design
                  - definition [ref=e135]: The table opens the Catalogue, a list of every enchantment stored in the chiseled bookshelves around it. You choose the enchantment and the level, pay its specific reagent and an experience cost, and get exactly that. Bookshelves become a library you build deliberately.
            - article [ref=e136]:
              - generic [ref=e137]:
                - heading "Smithing Upgrades" [level=3] [ref=e138]
                - link "Read more" [ref=e139] [cursor=pointer]:
                  - /url: /features/smithing-upgrades
              - generic [ref=e141]:
                - generic [ref=e142]:
                  - term [ref=e143]: Vanilla
                  - definition [ref=e144]: Sharpness, Protection, Unbreaking and Efficiency are enchantments. They are also the only enchantments that matter, so every enchanting decision starts by securing them and ends with whatever slots are left.
                - generic [ref=e145]:
                  - term [ref=e146]: Problem
                  - definition [ref=e147]: Twelve vanilla enchantments are pure statistics wearing a magic costume. They crowd out the enchantments with actual behaviour, and they make the enchanting table a numbers dispenser rather than a place you go for something interesting.
                - generic [ref=e148]:
                  - term [ref=e149]: Fixed by Design
                  - definition [ref=e150]: Honing, Warding, Tempering and Grinding become smithing templates. You apply them at a smithing table, the ingot decides the level, and no experience is charged. Statistics live at the anvil's neighbour, magic lives at the enchanting table.
            - article [ref=e151]:
              - generic [ref=e152]:
                - heading "Campfire Elytra Flight" [level=3] [ref=e153]
                - link "Read more" [ref=e154] [cursor=pointer]:
                  - /url: /features/campfire-elytra-flight
              - generic [ref=e156]:
                - generic [ref=e157]:
                  - term [ref=e158]: Vanilla
                  - definition [ref=e159]: Elytra flight ends at firework rockets. Once you have a gunpowder farm, flight is holding right click in a straight line at a fixed speed, indefinitely.
                - generic [ref=e160]:
                  - term [ref=e161]: Problem
                  - definition [ref=e162]: Rockets delete route planning. Terrain stops mattering, distance stops mattering, and every transportation system you might have built becomes irrelevant the moment the elytra comes out. The best-looking mechanic in the game gets reduced to one button.
                - generic [ref=e163]:
                  - term [ref=e164]: Fixed by Design
                  - definition [ref=e165]: Firework rockets give zero thrust while gliding. Flight is powered by campfires instead. Crouch in the smoke to launch and to bank charges, spend those charges as mid-air dashes, and ride updraft columns you built on the ground.
            - article [ref=e166]:
              - generic [ref=e167]:
                - heading "Map Book" [level=3] [ref=e168]
                - link "Read more" [ref=e169] [cursor=pointer]:
                  - /url: /features/map-book
              - generic [ref=e171]:
                - generic [ref=e172]:
                  - term [ref=e173]: Vanilla
                  - definition [ref=e174]: Maps are single items. Covering any real distance means a chest of them, sorted by hand, and reading one means holding it and standing still. Sharing means cloning at a cartography table and hoping everyone remembers to re-clone.
                - generic [ref=e175]:
                  - term [ref=e176]: Problem
                  - definition [ref=e177]: Cartography is one of the best systems in Minecraft and almost nobody uses it past the first map, because the inventory cost grows faster than the usefulness. Shared exploration in particular has no answer at all.
                - generic [ref=e178]:
                  - term [ref=e179]: Fixed by Design
                  - definition [ref=e180]: The Map Book is one item holding many maps, opening as a pannable and zoomable full-screen atlas drawn in world coordinates. Two books can share an id, so several players read and edit the same atlas, with markers and holder positions synced live.
          - button "Show 2 more" [ref=e182]
