  - main [ref=f45e41]:
    - generic [ref=f45e43]:
      - generic [ref=f45e44]:
        - img "Fixed by Design" [ref=f45e45]
        - heading "Sign in" [level=1] [ref=f45e46]
        - paragraph [ref=f45e47]: Fixed by Design uses GitHub for authentication. Contributors and maintainers get access to the dashboard; everyone else gets an account for feedback and discussion.
      - generic [ref=f45e48]:
        - heading "GitHub sign-in is not configured on this instance" [level=2] [ref=f45e49]
        - paragraph [ref=f45e50]: The server has no GitHub OAuth credentials, so there is nothing to redirect to. If you are running this locally, create an OAuth app and fill in three values.
        - list [ref=f45e51]:
          - listitem [ref=f45e52]:
            - text: 1. Create an OAuth app at
            - link "github.com/settings/developers" [ref=f45e53] [cursor=pointer]:
              - /url: https://github.com/settings/developers
            - text: "with this authorization callback URL:"
            - code [ref=f45e54]: http://localhost:3000/auth/github
          - listitem [ref=f45e55]:
            - text: 2. Put the credentials in
            - code [ref=f45e56]: .env
            - text: ":"
            - code [ref=f45e57]: NUXT_OAUTH_GITHUB_CLIENT_ID= NUXT_OAUTH_GITHUB_CLIENT_SECRET= NUXT_ADMIN_GITHUB_LOGINS=your-login
          - listitem [ref=f45e58]: 3. Restart the server. Nuxt reads environment variables at boot, not on reload.
        - paragraph [ref=f45e59]:
          - text: Without your login in
          - code [ref=f45e60]: NUXT_ADMIN_GITHUB_LOGINS
          - text: ", the first sign-in creates a player account and the dashboard stays locked. It is re-checked on every sign-in."
      - paragraph [ref=f45e61]:
        - text: Everything except the dashboard works without an account.
        - link "Send feedback" [ref=f45e62] [cursor=pointer]:
          - /url: /feedback
