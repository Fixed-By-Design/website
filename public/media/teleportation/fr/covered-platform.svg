<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title description" lang="fr">
<title id="title">Un sol décoratif peut recouvrir la plateforme</title><desc id="description">Coupe de côté : fondation en or sous un sol d’andésite polie et de moquette. La magnétite centrale reste exposée. Des pointillés verts marquent la zone d’embarquement au-dessus du sol.</desc>
<metadata>Fixed by Design schematic. Unmodified Minecraft textures: Mojang Studios. Not an in-game screenshot.</metadata>
