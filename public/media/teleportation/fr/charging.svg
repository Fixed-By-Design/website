<svg xmlns="http://www.w3.org/2000/svg" width="960" height="286" viewBox="0 0 960 286" role="img" aria-labelledby="title description" lang="fr">
<title id="title">Charger une boussole liée à l’enclume</title><desc id="description">Une boussole liée et une étoile du Nether donnent une boussole du Wither pour un niveau d’expérience. La texture reste celle de la boussole ordinaire. Une charge paie pour tout le groupe.</desc>
<metadata>Fixed by Design schematic. Unmodified Minecraft textures: Mojang Studios. Not an in-game screenshot.</metadata>
